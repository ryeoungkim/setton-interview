<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>投稿の確認｜セットン</title>
<style>
  :root {
    --bg: #FAF7F1; --surface: #FFFFFF; --ink: #2B2622; --ink-2: #7A7168; --line: #E8E1D6;
    --accent: #B5453E; --accent-soft: #F7E9E7; --calm: #33569E; --ok: #3E8E5A; --ok-soft: #E7F1EA;
    --sd1:#2E5FA3; --sd2:#C4413C; --sd3:#E0AE38; --sd4:#3E8E5A; --sd5:#8A5CA8;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171512; --surface:#211E1A; --ink:#ECE7DF; --ink-2:#A79D91; --line:#37322B;
      --accent:#D96C63; --accent-soft:#3A2422; --calm:#8AA6E0; --ok:#5FAE7D; --ok-soft:#233026;
      --sd1:#5B84C9; --sd2:#D4655F; --sd3:#D9B45C; --sd4:#5FAE7D; --sd5:#A57EC4; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 16px; line-height: 1.9; display: flex; flex-direction: column; }
  .stripe { height: 4px; flex: none;
    background: linear-gradient(90deg, var(--sd1) 0 20%, var(--sd2) 20% 40%, var(--sd3) 40% 60%, var(--sd4) 60% 80%, var(--sd5) 80% 100%); }
  main { flex: 1; width: 100%; max-width: 660px; margin: 0 auto; padding: 20px 22px 60px; display: flex; flex-direction: column; }

  /* ヘッダー */
  .head { margin: 4px 0 6px; }
  .head h1 { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .head p { color: var(--ink-2); font-size: 14px; margin: 0; }

  /* 集計バー（スティッキー） */
  .summary { position: sticky; top: 0; z-index: 5; margin: 14px 0 6px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
  .summary .s { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .summary .s b { font-size: 15px; color: var(--ink); }
  .summary .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.rev { background: var(--accent); }
  .dot.later { background: var(--sd3); } .dot.todo { background: var(--line); border: 1px solid var(--ink-2); }
  .summary .alldone { margin-left: auto; color: var(--ok); font-weight: 700; display: none; }
  .summary.done .alldone { display: inline; }

  /* カード */
  .card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 16px 16px 14px; margin-top: 16px; transition: border-color .2s ease, opacity .2s ease; }
  .card.settled { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .card.settled.rev { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .card.settled.later { border-color: color-mix(in srgb, var(--sd3) 55%, var(--line)); }

  .itemhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .chbadge { font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 3px 11px; border-radius: 999px; }
  .chbadge.X { color: #fff; background: var(--calm); }
  .chbadge.note { color: #fff; background: var(--sd4); }
  .itemlabel { font-size: 13px; color: var(--ink-2); }
  .chip { margin-left: auto; font-size: 12.5px; font-weight: 700; padding: 4px 12px; border-radius: 999px; display: none; }
  .chip.show { display: inline-block; }
  .chip.ok { color: var(--ok); background: var(--ok-soft); }
  .chip.rev { color: var(--accent); background: var(--accent-soft); }
  .chip.later { color: #7a5a10; background: color-mix(in srgb, var(--sd3) 22%, transparent); }
  .chip .pending { font-weight: 500; opacity: .8; }

  .postbody { border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    padding: 14px 15px; max-height: 42vh; overflow-y: auto;
    font-size: 16px; line-height: 1.9; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .postbody.note-art { font-family: var(--serif); }
  .postbody .flag { color: var(--accent); font-weight: 700; font-size: 13.5px; font-family: var(--sans); }
  .postbody .r-lead { font-size: 12.5px; color: var(--accent); font-weight: 700; margin-bottom: 10px; }
  .postbody .r-body { font-size: 16px; line-height: 1.9; }
  .postbody .r-tags { margin-top: 12px; color: var(--calm); font-weight: 600; font-size: 14px; }
  .postbody .r-reply { margin-top: 14px; padding-top: 11px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-2); line-height: 1.7; }
  .postbody .r-reply .r-rl { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-right: 8px; }

  /* 判定ボタン（1行3択・コンパクト） */
  .decide { display: flex; gap: 8px; margin-top: 14px; }
  .dbtn { flex: 1; font-family: var(--sans); font-size: 14.5px; font-weight: 700; cursor: pointer;
    border-radius: 12px; padding: 12px 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform .1s ease; }
  .dbtn:active { transform: scale(.97); }
  .dbtn.ok.sel { background: var(--ok); border-color: var(--ok); color: #fff; }
  .dbtn.revise.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dbtn.later.sel { background: var(--sd3); border-color: var(--sd3); color: #3a2a05; }
  .dbtn:disabled { opacity: .55; cursor: default; }

  /* 修正パネル */
  .revise-panel { margin-top: 14px; padding-top: 14px; border-top: 1.5px dashed var(--line); display: none; }
  .revise-panel.show { display: block; }
  .revise-panel .lead { font-size: 13.5px; color: var(--ink-2); margin: 0 0 12px; text-align: center; }
  .transcript { width: 100%; min-height: 84px; max-height: 26vh; overflow-y: auto;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font-family: var(--sans); font-size: 15.5px; line-height: 1.85; color: var(--ink); resize: none; }
  .transcript:focus { outline: 2px solid var(--calm); border-color: transparent; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 9px; margin: 14px 0 6px; }
  .mic { width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; background: var(--accent); color: #fff;
    position: relative; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 38%, transparent); transition: transform .15s ease; }
  .mic:active { transform: scale(.94); }
  .mic svg { width: 28px; height: 28px; fill: #fff; }
  .mic.rec::before { content:""; position:absolute; inset:-8px; border-radius:50%;
    border: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.85); opacity:.9; } 100% { transform: scale(1.25); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .mic.rec::before { animation: none; opacity:.6; } }
  .mic-hint { font-size: 13px; color: var(--ink-2); text-align: center; }
  .mic-hint.rec { color: var(--accent); font-weight: 700; }
  .r-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .btn { font-family: var(--sans); font-size: 14.5px; font-weight: 600; cursor: pointer; border-radius: 999px;
    padding: 11px 20px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .cancel-revise { background: none; border: none; color: var(--ink-2); font-size: 12.5px; cursor: pointer;
    font-family: var(--sans); margin-top: 10px; text-decoration: underline; text-underline-offset: 3px; display: block; margin: 12px auto 0; }

  .backlink { display: inline-block; margin-top: 26px; color: var(--calm); font-size: 14px; text-decoration: none; }
  footer { flex: none; text-align: center; font-size: 11.5px; color: var(--ink-2); padding: 10px 20px 16px; }
  :focus-visible { outline: 2px solid var(--calm); outline-offset: 2px; }
</style>
</head>
<body>
<div class="stripe"></div>
<main>

  <div class="head">
    <h1>投稿の確認をお願いします</h1>
    <p>X や note に出す文章です。1つずつ、<b>「これでOK」</b>か、直したいところは<b>「直す・付け足す」</b>で声で教えてください。押した結果はその場で金さんに届きます。</p>
  </div>

  <div class="summary" id="summary">
    <span class="s"><span class="dot ok"></span>承認 <b id="cOk">0</b></span>
    <span class="s"><span class="dot rev"></span>修正 <b id="cRev">0</b></span>
    <span class="s"><span class="dot later"></span>あとで <b id="cLater">0</b></span>
    <span class="s"><span class="dot todo"></span>未対応 <b id="cTodo">0</b></span>
    <span class="alldone">すべて確認できました ✓</span>
  </div>

  <div id="list"></div>

  <a class="backlink" href="index.html">← 最初の画面にもどる</a>

</main>
<footer>セットン韓国語教室 投稿確認｜v2</footer>

<script>
const WEBHOOK = "https://hook.eu1.make.com/4m12kwd1q6kdug4m1e9mx7h5oqmg1ncp";
const ROUND = "REVIEW";

/* 確認対象（発音ブロック・型適用：導入+X投稿7本 + note記事3本）。バッチ更新時はここを差し替える。
   X項目は lead=リード / text=本文 / tags=ハッシュタグ / reply=noteリプ（任意）。 */
const REVIEW_ITEMS = [
  { id:"X0", ch:"X", label:"導入投稿（発音シリーズの枠）", text:"きょうから、発音のはなしを少しずつ続けます。「発音は才能ではなく、手順で身につく」——韓国語を教えて26年、1000人以上を見てきて、私がいちばん伝えたいことです。まずは、韓国で「いちご」が通じなかった話から。", tags:"#韓国語 #韓国語勉強中" },
  { id:"X1", ch:"X", label:"X投稿①　発音・タルギ", lead:"よくある話", text:"韓国旅行でよくある話です。「いちごください」のつもりで「タルギ ジュセヨ」。果物屋さんで「えっ？」となります。カタカナのルビ通りだと、韓国の人には別の単語に聞こえるから。最初につまずくのは文字ではなく、パッチムの音なんです🍓", tags:"#韓国語発音 #パッチム", reply:"なぜ通じず、どう直すのか。noteにくわしく書きました📝→ 章1-1（公開後リンク）" },
  { id:"X2", ch:"X", label:"X投稿②　カナルビの罠", lead:"前回の続き", text:"前回の続き。やっかいなのは「通じない」ことより、一度カナルビで覚えた発音はなかなか直らないこと。ルビ教材で習ってから来られた生徒さんに多い。せっかくの韓国語が「下手に」聞こえてしまう。だから最初の一歩は、音から。", tags:"#韓国語発音 #韓国語勉強中" },
  { id:"X3", ch:"X", label:"X投稿③　発音は手順", lead:"〈発音は手順〉", text:"〈発音は手順〉のはなし。ㄹのパッチムは、舌先がどこに当たるかを教えて、舌を中に丸める練習を何回か。これで正確な音が出ます。才能ではありません。発音が直ると聞き取りも会話も変わって、生徒さんはすごく自信を持ちます。", tags:"#韓国語発音 #パッチム" },
  { id:"X4", ch:"X", label:"X投稿④　パクボゴム", lead:"体験レッスンでのこと", text:"オンライン体験でのこと。「パクボゴムのファンです」と言われて、私は一瞬「えっ？」。박の「ク」、보검の「ム」は、韓国語では音にして言わないんです。正しくは「パッポゴム」。カタカナ通りだと、別の名前に聞こえてしまう。", tags:"#韓国語発音 #韓国ドラマ", reply:"「小さいッ」の正体をnoteに📝→ 章1-3（公開後リンク）" },
  { id:"X5", ch:"X", label:"X投稿⑤　小さいッの正体", lead:"前回の続き", text:"前回の続き。日本語の小さい「ッ」に聞こえるパッチムは、実はㄱ・ㅂ・ㄷの三つ。同じ「ッ」でも口の形と舌の位置が全部違う。だから一つずつ分けて教えます。「同じに聞こえる音」を「違う音」として身につけるのが、通じる発音への近道。", tags:"#韓国語発音 #パッチム" },
  { id:"X6", ch:"X", label:"X投稿⑥　母音ㅓ", lead:"母音のはなし", text:"韓国語の「オ」は二つあります。口を縦にするㅗと、少し横にするㅓ。日本語のオは一つだから難しい。私は「口を小さく横に、下顎が少し前に」と教えます。難しく言うと心が前を向かない。簡単な言葉に置き換えるのがコツ。", tags:"#韓国語発音 #韓国語勉強中" },
  { id:"X7", ch:"X", label:"X投稿⑦　赤ちゃんの音知覚", lead:"しめくくり／次への橋", text:"発音のはなし、しめくくり。生後2ヶ月の赤ちゃんは母国語以外の音もすべて聞き分けています。でも10〜12ヶ月頃から、使わない音の区別は消えていく。大人の「聞き取れない」は能力不足ではなく、脳の整理の結果。だから発音は、手順から学び直せばいい。", tags:"#韓国語勉強中 #韓国語リスニング", reply:"発音が変わると、ドラマが聞き取れるようになります。次は「ドラマで学ぶ韓国語」のはなしを📺" },
  { id:"note1-1", ch:"note", label:"note記事　章1-1「タルギ ジュセヨ」が通じなかった日", text:"韓国語を教えて26、7年になります。イ・スンソンです。\n\n生徒さんからよく聞く話があります。ある生徒さんは、韓国旅行で果物屋さんに行って、覚えたての韓国語で「いちごください」と言ってみました。「딸기 주세요（タルギ ジュセヨ）」。ところがお店の人は「えっ？」という顔をします。全く通じなかったんです。\n\n食堂でも同じことが起きます。「ごはんください」のつもりで「パブ チュセヨ」。これも「えっ？なんですか？」となってしまいます。\n\nなぜでしょうか。\n\n韓国語の文字、ハングルは本当に簡単で、すぐに読めるようになります。ところが、発音でつまずく方がとても多い。特に最初につまずくのが「パッチム」です。\n\n日本の参考書の多くは、ㄹ・ㅂ・ㄱのパッチムに、小さい「ル」「プ」「ク」というフリガナを振っています。「딸기」なら「タルギ」。でも、このカナの通りに発音すると、韓国の人には全く違う単語に聞こえてしまうんです。\n\nやっかいなのは、通じないことだけではありません。一度この発音で覚えてしまうと、なかなか直らないんです。カタカナの発音のままだと、せっかく習ったのに「下手な韓国語」に聞こえてしまう。もったいないですよね。\n\nでは、どう直すのか。まず「こういう風に話すと、全く通じませんよ」とお伝えします。皆さんびっくりされます。そこから、舌の位置を教えます。まず舌先がどこに当たるのかを教えて、その後に舌を中に丸める練習をして、それを何回か繰り返す。この手順で、正確なㄹの音が出るようになります。\n\nその生徒さんも、練習したら、できました。とっても喜んでいました。発音が直ると、聞き取りも、会話もできるようになって、生徒さんはすごく自信を持ちます。\n\n発音は、才能ではありません。舌の位置と口の形の「手順」で身につくものです。その方法がどう生まれたかは、また次回に。\n\n（セットン韓国語教室 代表 イ・スンソン）" },
  { id:"note1-2", ch:"note", label:"note記事　章1-2　鏡の前で作った教え方", text:"前回、「タルギ ジュセヨ」が通じない話をしました。では、その「通じる発音」を、私はどうやって教えているのか。今日は、その方法が生まれたところをお話しします。\n\n教え始めて26、7年、日本の方にはどうしても出せない音がいくつかあると気づいていました。代表的なのが、ㄹのパッチムです。「こうすれば出ますよ」と説明しようとすると、これがなかなか難しい。自分では自然に出している音だからです。\n\nこの教え方は、どこかで習ったものではありません。鏡を見ながら、舌の位置や口の形を一つひとつ確認して作りました。\n【要確認：R1で「うちの先生と2人で」と話されていました。この方はどなたですか？】\n「まず舌先をここに当てて、それから舌を中に丸める」という手順にたどり着きました。\n\n言葉にできれば、教えられます。何回か繰り返すうちに正確なㄹの音が出てきて、その瞬間に「できましたよ」と伝えると、皆さんとても喜ばれます。\n【要確認：「できたよと書いて言ってあげた」場面は、オンラインのレッスンでしたか？】\n\n母音でも同じです。「ㅓ」は日本語の「オ」と違い、あまり難しく説明すると気持ちが前を向きません。「口をㅏより小さく横に開いて、下顎が少し前に出るくらい」と簡単な言葉に置き換えて、単語で練習してもらいます。\n\n発音は、出せない理由を突き止めて手順を言葉にすれば、誰でも身につけられる。その「言葉にする」作業を、私はずっと続けてきました。\n\n（イ・スンソン）" },
  { id:"note1-3", ch:"note", label:"note記事　章1-3　パクボゴムが通じない", text:"ある日の、オンライン授業の無料体験でのことです。\n\n「ドラマをよく見ています」という方に「誰のファンですか？」と聞くと、「パクボゴム」。私は一瞬、「えっ？」と聞き返してしまいました。\n\n「パクボゴム」はカタカナ通りに読むと、正確な音から少しずれます。韓国語のパッチムでは、박の「ク」や보검の「ム」は、はっきり音にして言わないんです。でも日本語にはこの感覚がないので「パーク」「ボゴ・ム」と付けてしまい、別の人の名前に聞こえることも。正しくは「パッポゴム」です。\n\n教え方は「パクの部分は、パッという小さい『ッ』を、口を開けたまま舌を動かさないで」と、口と舌の動きで具体的に伝えます。この方も何回か練習すると言えるようになり、好きな俳優の名前を正しく言えたと喜んでいました。\n【要確認：この体験レッスンの方は、その後どうなりましたか？（入会されたか等）】\n\nこの「小さいッ」は一種類ではありません。ㄱ・ㅂ・ㄷの三つが日本語の「ッ」に聞こえますが、口の形と舌の位置がそれぞれ違う。だから一つずつ分けて教えます。\n【要確認：ㄱ・ㅂ・ㄷ、それぞれどんな単語を例に教えていますか？】\n\n発音練習は根気がいって飽きます。だから基本の母音が入った単語で練習し、できた時はしっかり褒める。パッチムは一番の難所ですが、口と舌の動きを言葉にして単語で楽しく練習すれば、必ず言えるようになります。\n\n（イ・スンソン）" },
];

/* ===== 状態（各項目の判定を保存・再開） ===== */
const SKEY = "postreview2-" + ROUND;
const store = {
  load() { try { return JSON.parse(localStorage.getItem(SKEY)) || null; } catch(e){ return null; } },
  save(s) { localStorage.setItem(SKEY, JSON.stringify(s)); },
};
if (new URLSearchParams(location.search).has("reset")) {
  localStorage.removeItem(SKEY);
  Object.keys(localStorage).filter(k => k.indexOf("sendq-") === 0).forEach(k => localStorage.removeItem(k));
  history.replaceState(null, "", location.pathname);
}
let state = store.load() || { session: "REV-" + Math.random().toString(36).slice(2,7), decisions: {} };
if (!state.decisions) state.decisions = {};

const $ = id => document.getElementById(id);

/* ---------- 音声認識（TTS読み上げは廃止） ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let rec = null, recording = false, baseText = "";
let active = null; // { id, ta, mic, hint, actions }

function setRecUI(on) {
  if (!active) return;
  active.mic.classList.toggle("rec", on); active.hint.classList.toggle("rec", on);
  active.hint.textContent = on ? "録音中 — 話し終わったら、もう一度ボタンを押してください" : "ボタンを押して話す";
}
function showActions(){ if (active) active.actions.classList.add("show"); }
function hideActions(){ if (active) active.actions.classList.remove("show"); }

function startRec() {
  if (!active) return;
  if (!SR) {
    active.ta.focus();
    active.hint.textContent = "この端末では、キーボードのマイクキーで音声入力してください";
    showActions(); return;
  }
  const ta = active.ta;
  baseText = ta.value ? ta.value + " " : "";
  rec = new SR();
  rec.lang = "ja-JP"; rec.continuous = !IS_IOS; rec.interimResults = true;
  rec.onresult = e => {
    let text = "";
    if (IS_IOS) text = e.results[e.results.length - 1][0].transcript;
    else for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    ta.value = baseText + text; ta.scrollTop = ta.scrollHeight;
  };
  rec.onend = () => { if (recording) { baseText = ta.value ? ta.value + " " : ""; try { rec.start(); } catch(e){} } };
  rec.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      recording = false; setRecUI(false);
      active.hint.textContent = "マイクが使えないため、下の枠にキーボードで入力してください";
      active.ta.focus(); showActions();
    }
  };
  try { rec.start(); } catch(e){}
  recording = true; setRecUI(true);
}
function stopRec() {
  recording = false; if (rec) { try { rec.stop(); } catch(e){} }
  setRecUI(false);
  if (active) { active.ta.value = dedupeText(active.ta.value); if (active.ta.value.trim()) showActions(); }
}
function dedupeText(s) {
  const MIN = 6; let t = s; let changed = true;
  while (changed) {
    changed = false;
    for (let len = Math.floor(t.length / 2); len >= MIN && !changed; len--) {
      for (let i = 0; i + len <= t.length; i++) {
        const chunk = t.slice(i, i + len), rest = t.slice(i + len);
        const gap = (rest.match(/^[\s、。]*/) || [""])[0].length;
        if (rest.slice(gap, gap + len) === chunk) { t = t.slice(0, i + len) + rest.slice(gap + len); changed = true; break; }
      }
    }
  }
  return t;
}

/* ---------- 送信（キュー方式・オフライン再送） ---------- */
function loadQ(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e){ return []; } }
function saveQ(key, q) { q.length ? localStorage.setItem(key, JSON.stringify(q)) : localStorage.removeItem(key); }
const QKEY = "sendq-" + ROUND;
function post(item) {
  return fetch(WEBHOOK, { method: "POST", mode: "no-cors", keepalive: true,
    headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(item) })
    .then(() => true).catch(() => false);
}
async function flushQueue() {
  const keys = Object.keys(localStorage).filter(k => k.indexOf("sendq-") === 0);
  for (const key of keys) {
    let q = loadQ(key);
    while (q.length) { if (!(await post(q[0]))) return; q = q.slice(1); saveQ(key, q); }
  }
}
async function send(item, decision) {
  const r = { session: state.session, round: ROUND, qindex: item.id,
    question: "[" + item.ch + "] " + item.label, answer: decision, ts: new Date().toISOString() };
  const q = loadQ(QKEY); q.push(r); saveQ(QKEY, q);
  await flushQueue();
  return !loadQ(QKEY).some(x => x.ts === r.ts); // true = 送信済み / false = キュー滞留
}
window.addEventListener("online", flushQueue);
flushQueue();

/* ---------- 描画 ---------- */
function esc(s){ return s.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
function postInnerHTML(item) {
  if (item.ch === "note") {
    return item.text.split("\n").map(line =>
      /^【要確認/.test(line.trim()) ? '<span class="flag">' + esc(line) + '</span>' : esc(line)
    ).join("\n");
  }
  let html = "";
  if (item.lead)  html += '<div class="r-lead">リード：' + esc(item.lead) + '</div>';
  html += '<div class="r-body">' + esc(item.text) + '</div>';
  if (item.tags)  html += '<div class="r-tags">' + esc(item.tags) + '</div>';
  if (item.reply) html += '<div class="r-reply"><span class="r-rl">リプ</span>' + esc(item.reply) + '</div>';
  return html;
}

const MIC_SVG = '<svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-2.56A8 8 0 0 0 20 11.5h-2Z"/></svg>';

function buildCard(item) {
  const card = document.createElement("div");
  card.className = "card"; card.id = "card-" + item.id;
  card.innerHTML =
    '<div class="itemhead">' +
      '<span class="chbadge ' + item.ch + '">' + item.ch + '</span>' +
      '<span class="itemlabel">' + esc(item.label) + '</span>' +
      '<span class="chip" id="chip-' + item.id + '"></span>' +
    '</div>' +
    '<div class="postbody ' + (item.ch === "note" ? "note-art" : "") + '">' + postInnerHTML(item) + '</div>' +
    '<div class="decide">' +
      '<button class="dbtn ok"     data-act="ok">✅ これでOK</button>' +
      '<button class="dbtn revise" data-act="revise">✏️ 直す・付け足す</button>' +
      '<button class="dbtn later"  data-act="later">🕒 あとで</button>' +
    '</div>' +
    '<div class="revise-panel" id="rev-' + item.id + '">' +
      '<p class="lead">直したいところ・付け足したいことを、声で話してください（キーボード入力も可）。</p>' +
      '<div class="controls">' +
        '<button class="mic" aria-label="話す" id="mic-' + item.id + '">' + MIC_SVG + '</button>' +
        '<span class="mic-hint" id="hint-' + item.id + '">ボタンを押して話す</span>' +
      '</div>' +
      '<textarea class="transcript" id="ta-' + item.id + '" placeholder="ここに話した内容が文字になります（手で直してもOK）"></textarea>' +
      '<div class="r-actions" id="acts-' + item.id + '" style="display:none;">' +
        '<button class="btn" data-act="retry">録り直す</button>' +
        '<button class="btn primary" data-act="send-revise">この修正を送る</button>' +
      '</div>' +
      '<button class="cancel-revise" data-act="cancel-revise">とじる</button>' +
    '</div>';

  const decideRow = card.querySelector(".decide");
  const revPanel = card.querySelector("#rev-" + item.id);
  const acts = card.querySelector("#acts-" + item.id);
  const ta = card.querySelector("#ta-" + item.id);
  const micBtn = card.querySelector("#mic-" + item.id);
  const hint = card.querySelector("#hint-" + item.id);

  // r-actions は .show クラスで表示
  const actsWrap = acts;
  const showA = () => actsWrap.style.display = "flex";
  const hideA = () => actsWrap.style.display = "none";
  // active 用に actions ラッパを差し替え（showActions/hideActions が参照）
  const actionsProxy = { classList: { add: showA, remove: hideA } };

  function focusHere() {
    active = { id: item.id, ta, mic: micBtn, hint, actions: actionsProxy };
  }
  function openRevise() {
    if (recording) stopRec();
    revPanel.classList.add("show");
    ta.value = ""; hideA(); focusHere(); setRecUI(false); recording = false;
  }
  function closeRevise() {
    if (recording) stopRec();
    revPanel.classList.remove("show"); hideA();
    if (active && active.id === item.id) active = null;
  }

  decideRow.addEventListener("click", async (e) => {
    const btn = e.target.closest(".dbtn"); if (!btn) return;
    const act = btn.dataset.act;
    if (act === "revise") { openRevise(); return; }
    // ok / later はその場で送信
    closeRevise();
    const decision = act === "ok" ? "承認" : "(あとで)";
    await commit(item, act === "ok" ? "ok" : "later", decision);
  });

  micBtn.addEventListener("click", () => { focusHere(); recording ? stopRec() : startRec(); });
  acts.addEventListener("click", (e) => {
    const btn = e.target.closest(".btn"); if (!btn) return;
    if (btn.dataset.act === "retry") { ta.value = ""; baseText = ""; focusHere(); hideA(); startRec(); }
    if (btn.dataset.act === "send-revise") sendRevise();
  });
  revPanel.querySelector('[data-act="cancel-revise"]').addEventListener("click", closeRevise);

  async function sendRevise() {
    focusHere();
    const fb = dedupeText(ta.value.trim()); if (!fb) { ta.focus(); return; }
    const sendBtn = acts.querySelector('[data-act="send-revise"]');
    sendBtn.disabled = true;
    await commit(item, "rev", "修正・補足：" + fb, fb);
    sendBtn.disabled = false;
    closeRevise();
  }

  return card;
}

/* 判定の確定：送信 → 状態保存 → 見た目更新 */
async function commit(item, kind, answer, detail) {
  const sent = await send(item, answer);
  state.decisions[item.id] = { kind, answer, detail: detail || "", sent };
  store.save(state);
  applyDecision(item.id);
  updateSummary();
}

function applyDecision(id) {
  const d = state.decisions[id];
  const card = $("card-" + id), chip = $("chip-" + id);
  const btns = card.querySelectorAll(".dbtn");
  btns.forEach(b => b.classList.remove("sel"));
  card.classList.remove("settled", "ok", "rev", "later");
  chip.className = "chip";
  if (!d) { chip.classList.remove("show"); return; }
  const map = { ok: ["ok", "✅ 承認済み"], rev: ["rev", "✏️ 修正を送信"], later: ["later", "🕒 あとで"] };
  const [cls, txt] = map[d.kind];
  card.classList.add("settled", cls);
  card.querySelector(".dbtn." + (d.kind === "rev" ? "revise" : d.kind)).classList.add("sel");
  chip.classList.add("show", cls);
  chip.innerHTML = esc(txt) + (d.sent ? "" : ' <span class="pending">（送信待ち）</span>');
}

function updateSummary() {
  let ok=0, rev=0, later=0;
  Object.values(state.decisions).forEach(d => { if (d.kind==="ok") ok++; else if (d.kind==="rev") rev++; else if (d.kind==="later") later++; });
  const todo = REVIEW_ITEMS.length - (ok+rev+later);
  $("cOk").textContent = ok; $("cRev").textContent = rev; $("cLater").textContent = later; $("cTodo").textContent = todo;
  $("summary").classList.toggle("done", todo === 0);
}

/* 初期描画 */
(function init(){
  const list = $("list");
  REVIEW_ITEMS.forEach(item => {
    list.appendChild(buildCard(item));
    if (state.decisions[item.id]) applyDecision(item.id);
  });
  updateSummary();
})();
</script>
</body>
</html>
